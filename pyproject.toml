[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photolayout"
version = "0.1.0"
description = "基于人像检测的证件照处理与 6 寸相纸排版工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=1.0.1",
    "numpy",
    "opencv-contrib-python",
    "Pillow",
    "rembg[cpu]>=2.0",
    "reportlab",
]

[project.optional-dependencies]
web = ["gradio"]

[project.scripts]
photolayout = "photolayout.cli:main"

[tool.setuptools.packages.find]
include = ["photolayout*"]
